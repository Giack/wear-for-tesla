name: Bug report
description: Something in the app does not work as described on the site.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not paste your VIN, keys, tokens or an unedited Bluetooth log**: remove them first.
        Security problems go to a private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app from …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
    validations:
      required: true
  - type: input
    id: watch
    attributes:
      label: Watch model and Wear OS version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Bluetooth mode, Fleet mode]
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car model and year
  - type: textarea
    id: log
    attributes:
      label: Bluetooth log excerpt (optional, edited)
      description: Settings → Bluetooth log. Remove anything identifying first.
      render: text
