# Pushing a tag like v0.1 or v0.1.1 builds the Public APK, signs it with the release key from the
# repository secrets and attaches it to a GitHub Release. A tag with a suffix (v0.1-rc1) makes a pre-release.
# Auto release also calls it after a merge to main, with a tag that does not exist yet: the release
# then creates it on the merged commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, created on the calling commit if it does not exist
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag $TAG"; exit 1; }
          # versionCode grows with every release, so each APK installs over the previous one.
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + ${BASH_REMATCH[4]:-0} ))
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[5]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.WEAR_KEYSTORE_BASE64 }}
          WEAR_KEYSTORE_PASSWORD: ${{ secrets.WEAR_KEYSTORE_PASSWORD }}
          WEAR_KEY_ALIAS: ${{ secrets.WEAR_KEY_ALIAS }}
          WEAR_KEY_PASSWORD: ${{ secrets.WEAR_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          export WEAR_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$WEAR_KEYSTORE"
          ./gradlew test :wear:assemblePublicRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          rm -f "$WEAR_KEYSTORE"
          apk=wear/build/outputs/apk/public/release/wear-public-release.apk
          # Refuse to publish an APK that is unsigned or fell back to the debug key. A bare "! grep"
          # never trips errexit, and the default shell has no pipefail, so both are explicit.
          set -o pipefail
          # The runner image ships more than one build-tools. A glob in the command position
          # expands to every apksigner, and the first one treats the rest as arguments
          # ("Unsupported command"). Take the newest version, and say so if there is none.
          # `|| true`: with pipefail a missing directory fails the pipeline, and errexit would
          # stop the step before the message below.
          # shellcheck disable=SC2012 # version-sort the directory names; find does not
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$build_tools" || ! -x "${build_tools}apksigner" ]]; then
            echo "no apksigner under ${ANDROID_HOME}/build-tools" >&2
            exit 1
          fi
          "${build_tools}apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "APK is debug-signed"; exit 1; fi
          cp "$apk" "$RUNNER_TEMP/wear-for-tesla-$VERSION_NAME.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes --title "Wear for Tesla $VERSION_NAME")
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" "$RUNNER_TEMP/wear-for-tesla-$VERSION_NAME.apk" --target "$GITHUB_SHA" "${flags[@]}"
