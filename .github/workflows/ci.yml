# Builds the Public APK and runs the JVM tests on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :wear:lintPublicRelease :wear:assemblePublicRelease
      - uses: actions/upload-artifact@v4
        with:
          name: wear-public-apk
          path: android/wear/build/outputs/apk/public/release/*.apk
