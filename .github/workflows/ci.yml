# Builds the Public APK and runs the JVM tests on every pull request and push to main that touches the app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A path filter on the trigger would leave the required check missing (PR blocked); a skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, force push): build to be safe.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: a file moved out of android/ must still count as an app change.
          if git diff --name-only --no-renames "$BASE" HEAD | grep -qE '^(android/|\.github/workflows/ci\.yml$)'; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  build:
    # Required status check for main (repository ruleset): keep the name in sync.
    name: Build and test
    needs: changes
    # Fail closed: build unless the changes job succeeded and said "docs only".
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test :wear:lintPublicRelease :wear:assemblePublicRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wear-public-apk
          path: android/wear/build/outputs/apk/public/release/*.apk
